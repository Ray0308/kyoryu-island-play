<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>きょうりゅうの しま ― たまごを めぐる ぼうけん</title><link rel="preload" as="image" href="assets/catalog/plant-0-power-v2.png" fetchpriority="high">
<style>
html:not(.app-ready) #adventure{visibility:hidden}*{box-sizing:border-box}body{margin:0;background:#faf7eb;color:#304f48;font-family:'Yu Gothic',sans-serif;text-align:center}main{max-width:800px;margin:auto;padding:24px 16px}h1{font-size:clamp(24px,5vw,36px);margin:12px}p{line-height:1.8}.badge{display:inline-block;background:#e5edd7;padding:8px 20px;border-radius:30px;font-weight:bold}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#d7e8b7;padding:12px;border-radius:26px;width:min(100%,420px);margin:20px auto}.cell{aspect-ratio:1;background:#fffdf3;border-radius:15px;display:grid;place-items:center;font-size:clamp(30px,8vw,48px)}.rock{background:#bdd399}.rabbit{background:#ffdfab;box-shadow:0 0 0 3px #eea851}.panel{background:white;border-radius:24px;padding:18px;box-shadow:0 8px 25px #3e61480b}.queue{min-height:68px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0}.queue button{background:#fff0d2;font-size:25px;padding:8px 13px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{font:inherit;border:0;border-radius:16px;padding:14px 20px;cursor:pointer;font-weight:bold;color:#304f48;min-height:52px}button:focus-visible{outline:4px solid #e39338;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.arrow{font-size:32px;background:#e6f1dd;min-width:68px}.go{background:#efb963}.secondary{background:#edf0e8}.status{font-weight:bold;min-height:32px;margin:14px 0}details{text-align:left;margin-top:24px;font-size:14px}summary{cursor:pointer}footer{margin:20px;font-size:13px;color:#6a7d70}@media(prefers-reduced-motion:no-preference){.rabbit{animation:pop .3s}@keyframes pop{50%{transform:scale(1.1)}}}

<main hidden inert><div class="badge" id="stage"></div><h1>きょうりゅうの たまご だいぼうけん</h1><p>やじるしを ならべて<br>きょうりゅうを 🥚 まで つれていこう！</p><div class="board" id="board" aria-label="ゲームの ます"></div><section class="panel" aria-label="めいれい"><strong>どっちへ いこう？</strong><div class="controls" id="arrows"></div><div class="queue" id="queue" aria-label="ならべた やじるし"></div><small>やじるしを おすと けせるよ</small><div class="status" id="status" role="status" aria-live="polite"></div><div class="controls"><button class="secondary" id="clear">やりなおす</button><button class="go" id="run">▶ うごかす</button><button class="go" id="next" hidden>つぎへ →</button></div></section><details><summary>おとなの かたへ</summary><p>矢印は画面の上下左右へ１マス進む命令です。最初は「どう進むと思う？」と一緒に予想し、動きを眺めてみてください。間違えても失点や時間制限はありません。「どこを変えたら届くかな？」と試す過程を楽しむゲームです。</p><p>全５面。順番を考えることから始める試作品です。音声・繰り返し命令は未実装です。</p></details><footer>ゆっくり、なんどでも。じぶんで できた！を たいせつに。</footer></main>
<script>
const levels=[{s:[2,3],g:[2,1],r:[]},{s:[1,3],g:[3,2],r:[]},{s:[0,3],g:[3,1],r:[[1,3],[1,2]]},{s:[0,4],g:[4,0],r:[[1,4],[1,3],[3,1],[3,0]]},{s:[0,2],g:[4,2],r:[[2,1],[2,2],[2,3]]}];
const dirs={up:[0,-1,'⬆','うえ'],down:[0,1,'⬇','した'],left:[-1,0,'⬅','ひだり'],right:[1,0,'➡','みぎ']};
let level=0,pos=[],queue=[],busy=false,won=false;
const $=id=>document.getElementById(id); const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function draw(){ $('stage').textContent=`ステージ ${level+1} / ${levels.length}`;$('board').querySelectorAll('.cell').forEach(c=>c.remove());for(let y=0;y<5;y++)for(let x=0;x<5;x++){let c=document.createElement('div'),p=[x,y],rock=levels[level].r.some(r=>same(r,p));c.className='cell'+(rock?' rock':'')+(same(pos,p)?' rabbit':'');c.textContent=same(pos,p)?'🦕':same(levels[level].g,p)?'🥚':rock?'🪨':'';$('board').append(c)} $('queue').replaceChildren();queue.forEach((d,i)=>{let b=document.createElement('button');b.textContent=dirs[d][2];b.setAttribute('aria-label',`${i+1}ばんめ ${dirs[d][3]}を けす`);b.disabled=busy||won;b.onclick=()=>{queue.splice(i,1);draw()};$('queue').append(b)});document.querySelectorAll('.arrow').forEach(b=>b.disabled=busy||won||queue.length>=40);$('run').disabled=busy||won||!queue.length;$('clear').disabled=busy;$('next').hidden=!won;}
function reset(){pos=[...levels[level].s];queue=[];won=false;$('status').textContent='やじるしを おしてみよう';draw()}
Object.entries(dirs).forEach(([key,d])=>{let b=document.createElement('button');b.className='arrow';b.textContent=d[2];b.setAttribute('aria-label',d[3]);b.onclick=()=>{queue.push(key);$('status').textContent='ならべたら「うごかす」を おそう';draw()};$('arrows').append(b)});
$('clear').onclick=reset;$('next').onclick=()=>{level=(level+1)%levels.length;reset()};
$('run').onclick=async()=>{busy=true;pos=[...levels[level].s];draw();for(let i=0;i<queue.length;i++){await new Promise(r=>setTimeout(r,550));let d=dirs[queue[i]],p=[pos[0]+d[0],pos[1]+d[1]];if(p.some(v=>v<0||v>4)||levels[level].r.some(r=>same(r,p))){$('status').textContent='おっと！ ここは とおれないね。かえてみよう';break}pos=p;draw();$('status').textContent=`${i+1} ぽ すすんだよ`;if(same(pos,levels[level].g)){won=true;$('status').textContent='🎉 できた！ たまごを みつけたよ！';if(level===levels.length-1)$('next').textContent='もういちど あそぶ ↻';break}}busy=false;if(!won&&same(pos,levels[level].s)===false&&$('status').textContent.includes('すすんだ'))$('status').textContent='あと すこし！ やじるしを かえてみよう';draw()};reset();
</script><script src="editor.js"></script><script src="layout.js"></script><script src="adventure.js"></script><script src="journey.js"></script><script src="character.js"></script><script src="random-stage.js"></script><script src="catalog.js"></script><script src="parent-gate.js"></script><script src="field-data.js"></script><script src="field-guide.js"></script><script src="catalog-fit.js"></script><script src="title-scene.js"></script><script src="journal.js"></script><script src="secret-motion.js"></script><script src="test-complete.js"></script><script src="game-scene.js"></script><script src="navigation.js"></script><script src="github-save-client.js"></script><script src="github-save.js"></script><script src="world.js"></script></html>
